[project]
name = "prompt-ops-eval-harness"
version = "0.1.0"
description = "Evaluation harness benchmarking agentic prompt contracts, schema grounding, and recovery loops in lakehouse data platforms."
authors = [{ name = "Jen Kelleman" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]
keywords = ["prompt-engineering", "agentic-ai", "pydantic", "microsoft-fabric", "lakehouse", "eval-harness"]

[project.optional-dependencies]
dev = ["pytest>=8"]
demo = ["streamlit>=1.35"]

[project.urls]
Homepage = "https://aiwithjen.com/code"
Repository = "https://github.com/jkelleman/prompt-ops-eval-harness"

[tool.poetry]
packages = [{ include = "eval_harness", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
