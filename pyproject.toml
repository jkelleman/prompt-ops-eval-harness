[project]
name = "prompt-ops-eval-harness"
version = "0.1.0"
description = "Eval harness that holds AI agent plans to contracts: grounding, human-in-the-loop gates, and self-healing recovery."
authors = [{ name = "Jen Kelleman" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]
keywords = ["agentic-ai", "conversation-design", "content-design", "ai-evals", "prompt-engineering", "human-in-the-loop", "pydantic", "microsoft-fabric", "lakehouse"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
demo = ["streamlit>=1.35"]

[project.urls]
Homepage = "https://aiwithjen.com/code"
Repository = "https://github.com/jkelleman/prompt-ops-eval-harness"

[tool.poetry]
packages = [{ include = "eval_harness", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "UP", "RUF"]
ignore = ["E501", "UP042"]  # long eval-case strings; keep (str, Enum) behavior stable

[tool.ruff.lint.isort]
known-first-party = ["eval_harness"]
